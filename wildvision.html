<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WildVision — Голосование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1130;
    --bg2:#0F1A44;
    --card:#131C4C;
    --card-hover:#182258;
    --blue:#3D5AFE;
    --blue-light:#7C94FF;
    --pink:#FF3D71;
    --white:#F5F7FF;
    --grey:#8A93C4;
    --line:rgba(245,247,255,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:110px;
  }

  /* ---- NAV ---- */
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--line);
    background:var(--bg2);
    position:sticky; top:0; z-index:20;
  }
  .logo{font-weight:800; font-size:18px; letter-spacing:-0.01em;}
  .logo span{color:var(--blue-light);}
  .tag{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em;
    color:var(--grey); border:1px solid var(--line); padding:5px 10px; border-radius:6px;
    text-transform:uppercase;
  }

  .wrap{max-width:640px; margin:0 auto; padding:0 20px;}

  /* ---- HERO ---- */
  .hero{padding:40px 0 24px; text-align:center;}
  .hero h1{font-size:clamp(26px,6vw,34px); font-weight:800; letter-spacing:-0.01em;}
  .hero p{color:var(--grey); font-size:14px; margin-top:10px; line-height:1.5;}
  .rules{
    display:inline-flex; gap:16px; margin-top:18px; flex-wrap:wrap; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--blue-light);
  }
  .rules span{border:1px solid rgba(61,90,254,0.35); background:rgba(61,90,254,0.08); padding:6px 10px; border-radius:6px;}

  /* ---- LIST ---- */
  .list{margin-top:20px; border-top:1px solid var(--line);}
  .item{
    display:flex; align-items:center; gap:14px;
    padding:18px 4px; border-bottom:1px solid var(--line);
    transition:background .15s ease;
  }
  .item.active{background:rgba(61,90,254,0.06);}
  .item .flag{font-size:28px; width:34px; flex-shrink:0;}
  .item .meta{flex:1; min-width:0;}
  .item .meta .country{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--grey);
  }
  .item .meta .artist{font-weight:700; font-size:16px; margin-top:2px;}
  .item .meta .song{font-size:13px; color:var(--grey); margin-top:1px;}

  .stepper{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .stepper button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--white); font-size:16px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .stepper button:hover:not(:disabled){border-color:var(--blue-light); background:var(--card-hover);}
  .stepper button:disabled{opacity:0.3; cursor:not-allowed;}
  .stepper .count{
    width:22px; text-align:center; font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:15px;
  }

  /* ---- FIXED CART BAR ---- */
  .cartbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--bg2); border-top:1px solid var(--line);
    padding:14px 20px; z-index:30;
  }
  .cartbar-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:16px;}
  .cart-info{flex:1;}
  .cart-info .label{font-size:12px; color:var(--grey); font-family:'JetBrains Mono', monospace;}
  .cart-info .count{font-weight:800; font-size:18px; color:var(--white);}
  .progress{height:5px; background:rgba(255,255,255,0.08); border-radius:99px; margin-top:6px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--blue), var(--pink)); border-radius:99px; transition:width .25s ease; width:0%;}
  .submit-btn{
    font-family:'Inter', sans-serif; font-weight:700; font-size:14px;
    background:var(--blue); color:#fff; border:none; border-radius:10px;
    padding:13px 24px; cursor:pointer; white-space:nowrap;
    transition:opacity .15s ease, transform .1s ease;
  }
  .submit-btn:hover:not(:disabled){opacity:0.9;}
  .submit-btn:disabled{opacity:0.3; cursor:not-allowed;}
  .submit-btn:active{transform:scale(0.97);}

  .status-msg{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:12px;
    color:var(--blue-light); padding:14px 0 2px;
  }

  /* ---- ADMIN ---- */
  #admin{max-width:640px; margin:50px auto 0; padding:0 20px;}
  .admin-title{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--pink); margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .admin-title::after{content:''; flex:1; height:1px; background:var(--line);}
  .admin-box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px;}
  .admin-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .admin-row:last-child{border-bottom:none;}
  .admin-row .af{font-size:16px; width:22px;}
  .admin-row .an{flex:1; color:var(--grey);}
  .admin-row .apts{font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--white);}
  .voter-line{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--grey); padding:6px 0; border-bottom:1px dashed var(--line);}
  .voter-line:last-child{border-bottom:none;}

  footer{text-align:center; color:var(--grey); font-size:11px; margin-top:50px; padding-bottom:20px; font-family:'JetBrains Mono', monospace; letter-spacing:0.06em;}
</style>
</head>
<body>

<nav>
  <div class="logo">Wild<span>Vision</span></div>
  <div class="tag">Финал</div>
</nav>

<div class="wrap">
  <div class="hero">
    <h1>Отдай свой голос</h1>
    <p>Распредели голоса между номерами финала. Можно голосовать за один и тот же номер несколько раз.</p>
    <div class="rules"><span>До 10 голосов</span><span>Голосование открыто</span></div>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="status-msg" id="statusMsg"></div>

<div class="cartbar">
  <div class="cartbar-inner">
    <div class="cart-info">
      <div class="label">ВАШИ ГОЛОСА: <span class="count" id="cartCount">0</span>/10</div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="submit-btn" id="submitBtn" disabled>Оформить</button>
  </div>
</div>

<div id="admin" style="display:none;">
  <div class="admin-title">Admin · Результаты</div>
  <div class="admin-box" id="adminTotals"></div>
  <div class="admin-title">Admin · Голосующие</div>
  <div class="admin-box" id="adminVoters"></div>
</div>

<footer>WILDVISION · FAN-EDITION · 2026</footer>

<script>
const SONGS = [
  {id:'usa',     flag:'🇺🇸', country:'США',                   artist:'Lady Gaga', song:'Paparazzi'},
  {id:'russia',  flag:'🇷🇺', country:'Россия',                 artist:'Dead Blonde', song:''},
  {id:'belgium', flag:'🇧🇪', country:'Бельгия',                artist:'Трейси', song:'Я человек'},
  {id:'spm',     flag:'🇵🇲', country:'Сен-Пьер и Микелон',     artist:'Satoshi', song:'All We Are About'},
  {id:'moldova', flag:'🇲🇩', country:'Молдова',                artist:'The Weeknd & Madonna', song:'Popular'}
];
const MAX_VOTES = 10;

let cart = {};        // songId -> count, current unsubmitted cart
SONGS.forEach(s => cart[s.id] = 0);
let voterId = null;
let submitted = false;

const list = document.getElementById('list');
const cartCount = document.getElementById('cartCount');
const progressFill = document.getElementById('progressFill');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');

function totalCart(){ return Object.values(cart).reduce((a,b) => a+b, 0); }

function renderList(){
  list.innerHTML = '';
  const total = totalCart();
  SONGS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'item' + (cart[s.id] > 0 ? ' active' : '');
    row.innerHTML = `
      <div class="flag">${s.flag}</div>
      <div class="meta">
        <div class="country">${s.country}</div>
        <div class="artist">${s.artist}</div>
        ${s.song ? `<div class="song">«${s.song}»</div>` : ''}
      </div>
      <div class="stepper">
        <button data-act="minus" data-id="${s.id}" ${cart[s.id]===0 ? 'disabled' : ''}>−</button>
        <div class="count">${cart[s.id]}</div>
        <button data-act="plus" data-id="${s.id}" ${total>=MAX_VOTES ? 'disabled' : ''}>+</button>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('button').forEach(b => b.addEventListener('click', onStep));
  cartCount.textContent = total;
  progressFill.style.width = (total/MAX_VOTES*100) + '%';
  submitBtn.disabled = total === 0 || submitted;
}

function onStep(e){
  if(submitted) return;
  const id = e.currentTarget.dataset.id;
  const act = e.currentTarget.dataset.act;
  const total = totalCart();
  if(act === 'plus' && total < MAX_VOTES) cart[id]++;
  if(act === 'minus' && cart[id] > 0) cart[id]--;
  renderList();
}

async function ensureVoterId(){
  try{
    const r = await window.storage.get('voter-id', false);
    voterId = r.value;
  }catch(e){
    voterId = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    try{ await window.storage.set('voter-id', voterId, false); }catch(e2){}
  }
}

async function submitVote(){
  const total = totalCart();
  if(total === 0) return;
  submitBtn.disabled = true;
  statusMsg.textContent = 'Отправка…';
  try{
    await window.storage.set('votes:' + voterId, JSON.stringify(cart), true);
    await window.storage.set('my-cart', JSON.stringify(cart), false);
    submitted = true;
    statusMsg.textContent = '✓ Голоса учтены — спасибо за участие в WildVision!';
  }catch(e){
    statusMsg.textContent = 'Не удалось отправить голоса. Попробуй ещё раз.';
    submitBtn.disabled = false;
  }
  renderList();
}

async function loadOwnVote(){
  try{
    const r = await window.storage.get('my-cart', false);
    const saved = JSON.parse(r.value);
    Object.keys(saved).forEach(id => { if(cart[id] !== undefined) cart[id] = saved[id]; });
    submitted = true;
    statusMsg.textContent = '✓ Ты уже голосовал(а) в этом раунде.';
  }catch(e){}
}

/* ---- Admin view: open the page with ?admin at the end of the link ---- */
async function maybeRenderAdmin(){
  if(!new URLSearchParams(location.search).has('admin')) return;
  document.getElementById('admin').style.display = 'block';

  const totalsBox = document.getElementById('adminTotals');
  const votersBox = document.getElementById('adminVoters');
  totalsBox.innerHTML = 'Загрузка…';
  votersBox.innerHTML = '';

  const totals = {}; SONGS.forEach(s => totals[s.id] = 0);
  let voterEntries = [];
  try{
    const l = await window.storage.list('votes:', true);
    const keys = (l && l.keys) || [];
    for(const k of keys){
      try{
        const r = await window.storage.get(k, true);
        const c = JSON.parse(r.value);
        Object.keys(c).forEach(id => { if(totals[id] !== undefined) totals[id] += c[id]; });
        voterEntries.push({voter: k.replace('votes:',''), cart: c});
      }catch(e){}
    }
  }catch(e){}

  const ranked = SONGS.map(s => ({...s, pts: totals[s.id]})).sort((a,b) => b.pts - a.pts);
  totalsBox.innerHTML = ranked.map(s => `
    <div class="admin-row">
      <div class="af">${s.flag}</div>
      <div class="an">${s.country} — ${s.artist}</div>
      <div class="apts">${s.pts}</div>
    </div>
  `).join('');

  if(voterEntries.length === 0){
    votersBox.innerHTML = '<div class="voter-line">Пока никто не проголосовал</div>';
  } else {
    votersBox.innerHTML = voterEntries.map(v => {
      const parts = SONGS.filter(s => v.cart[s.id] > 0).map(s => `${s.flag}×${v.cart[s.id]}`).join('  ');
      return `<div class="voter-line">${v.voter.slice(0,10)}… → ${parts || '—'}</div>`;
    }).join('');
  }
}

async function init(){
  await ensureVoterId();
  await loadOwnVote();
  renderList();
  submitBtn.addEventListener('click', submitVote);
  await maybeRenderAdmin();
}

init();
</script>
</body>
</html>
