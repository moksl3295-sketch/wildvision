<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WildVision — Голосование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080D24;
    --bg2:#0D1538;
    --card:#111A42;
    --card-active:#182660;
    --blue:#4361FF;
    --blue-light:#8AA0FF;
    --pink:#FF3D71;
    --white:#F5F7FF;
    --grey:#8992BE;
    --grey-dim:#5E6690;
    --line:rgba(245,247,255,0.09);
    --ok:#3DDC97;
    --err:#FF6B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(900px 420px at 50% -10%, rgba(67,97,255,0.16), transparent 60%),
      var(--bg);
    color:var(--white);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px; border-bottom:1px solid var(--line);
    background:rgba(13,21,56,0.85);
    backdrop-filter:blur(10px);
    position:sticky; top:0; z-index:20;
  }
  .logo{font-weight:800; font-size:18px; letter-spacing:-0.01em;}
  .logo span{color:var(--blue-light);}
  .tag{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.12em;
    color:var(--blue-light); border:1px solid rgba(67,97,255,0.35); background:rgba(67,97,255,0.08);
    padding:5px 10px; border-radius:6px; text-transform:uppercase;
  }

  .wrap{max-width:640px; margin:0 auto; padding:0 20px;}

  .hero{padding:44px 0 26px; text-align:center;}
  .hero h1{font-size:clamp(27px,6vw,36px); font-weight:900; letter-spacing:-0.02em;}
  .hero p{color:var(--grey); font-size:14px; margin-top:10px; line-height:1.55; max-width:440px; margin-inline:auto;}
  .rules{
    display:inline-flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:center;
    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--blue-light);
  }
  .rules span{border:1px solid rgba(67,97,255,0.3); background:rgba(67,97,255,0.07); padding:7px 12px; border-radius:99px;}

  .list{margin-top:24px; display:flex; flex-direction:column; gap:10px;}
  .item{
    display:flex; align-items:center; gap:14px;
    padding:16px; border-radius:14px;
    background:var(--card); border:1px solid var(--line);
    transition:background .18s ease, border-color .18s ease;
  }
  .item.active{background:var(--card-active); border-color:rgba(67,97,255,0.4);}
  .item .flag{
    font-size:24px; width:46px; height:46px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(245,247,255,0.05); border-radius:12px;
  }
  .item .meta{flex:1; min-width:0;}
  .item .meta .country{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--grey-dim);
  }
  .item .meta .artist{font-weight:700; font-size:16px; margin-top:3px; letter-spacing:-0.01em;}
  .item .meta .song{font-size:13px; color:var(--grey); margin-top:1px;}

  .stepper{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .stepper button{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:rgba(245,247,255,0.04); color:var(--white); font-size:16px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .stepper button:hover:not(:disabled){border-color:var(--blue-light); background:rgba(67,97,255,0.14);}
  .stepper button:disabled{opacity:0.25; cursor:not-allowed;}
  .stepper .count{
    width:20px; text-align:center; font-family:'JetBrains Mono', monospace;
    font-weight:700; font-size:15px; color:var(--blue-light);
  }

  .cartbar{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(13,21,56,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    z-index:30;
  }
  .cartbar-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:16px;}
  .cart-info{flex:1;}
  .cart-info .label{font-size:11px; color:var(--grey); font-family:'JetBrains Mono', monospace; letter-spacing:0.06em;}
  .cart-info .count{font-weight:800; font-size:16px; color:var(--white);}
  .progress{height:5px; background:rgba(255,255,255,0.07); border-radius:99px; margin-top:7px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--blue), var(--pink)); border-radius:99px; transition:width .25s ease; width:0%;}
  .submit-btn{
    font-family:'Inter', sans-serif; font-weight:700; font-size:14px;
    background:var(--blue); color:#fff; border:none; border-radius:11px;
    padding:14px 26px; cursor:pointer; white-space:nowrap;
    transition:opacity .15s ease, transform .1s ease, background .15s ease;
    min-width:120px;
  }
  .submit-btn:hover:not(:disabled){opacity:0.92;}
  .submit-btn:disabled{opacity:0.3; cursor:not-allowed;}
  .submit-btn:active{transform:scale(0.97);}
  .submit-btn.retry{background:var(--err);}

  .status-msg{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:14px 20px 2px; min-height:18px; color:var(--blue-light);
  }
  .status-msg.ok{color:var(--ok);}
  .status-msg.err{color:var(--err);}

  #admin{max-width:640px; margin:50px auto 0; padding:0 20px;}
  .admin-title{
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--pink); margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .admin-title::after{content:''; flex:1; height:1px; background:var(--line);}
  .admin-box{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px;}
  .admin-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .admin-row:last-child{border-bottom:none;}
  .admin-row .af{font-size:16px; width:22px;}
  .admin-row .an{flex:1; color:var(--grey);}
  .admin-row .apts{font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--white);}
  .voter-line{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--grey); padding:6px 0; border-bottom:1px dashed var(--line);}
  .voter-line:last-child{border-bottom:none;}

  footer{text-align:center; color:var(--grey-dim); font-size:11px; margin-top:50px; padding-bottom:20px; font-family:'JetBrains Mono', monospace; letter-spacing:0.06em;}
</style>
</head>
<body>

<nav>
  <div class="logo">Wild<span>Vision</span></div>
  <div class="tag">Первый полу-финал</div>
</nav>

<div class="wrap">
  <div class="hero">
    <h1>Отдай свой голос</h1>
    <p>Распредели голоса между номерами финала. Можно голосовать за один и тот же номер несколько раз.</p>
    <div class="rules"><span>До 10 голосов</span><span>Голосование открыто</span></div>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="status-msg" id="statusMsg"></div>

<div class="cartbar">
  <div class="cartbar-inner">
    <div class="cart-info">
      <div class="label">ВАШИ ГОЛОСА: <span class="count" id="cartCount">0</span>/10</div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="submit-btn" id="submitBtn" disabled>Оформить</button>
  </div>
</div>

<div id="admin" style="display:none;">
  <div class="admin-title">Admin · Результаты</div>
  <div class="admin-box" id="adminTotals"></div>
  <div class="admin-title">Admin · Голосующие</div>
  <div class="admin-box" id="adminVoters"></div>
</div>

<footer>WILDVISION · FAN-EDITION · 2026</footer>

<script>
// Google Apps Script Web App URL — backend for shared vote storage (Google Sheet).
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_TJfrJ9MOOahH9XchMPIo2dkN9Ux3m8pfQ0Qrx6-Y3hgrDcgTjUHHxfqoznaUi8NBfg/exec';

const SONGS = [
  {id:'usa',     flag:'🇺🇸', country:'США',                   artist:'Lady Gaga', song:'Paparazzi'},
  {id:'russia',  flag:'🇷🇺', country:'Россия',                 artist:'Dead Blonde', song:'Пионерка'},
  {id:'belgium', flag:'🇧🇪', country:'Бельгия',                artist:'Трейси', song:'Я человек'},
  {id:'spm',     flag:'🇵🇲', country:'Сен-Пьер и Микелон',     artist:'Satoshi', song:'All We Are About'},
  {id:'moldova', flag:'🇲🇩', country:'Молдова',                artist:'The Weeknd & Madonna', song:'Popular'}
];
const MAX_VOTES = 10;
const STORAGE_KEY = 'wildvision-my-cart';
const VOTER_KEY = 'wildvision-voter-id';

let cart = {};
SONGS.forEach(s => cart[s.id] = 0);
let submitted = false;
let lastError = false;
let voterId = null;

const list = document.getElementById('list');
const cartCount = document.getElementById('cartCount');
const progressFill = document.getElementById('progressFill');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');

function totalCart(){ return Object.values(cart).reduce((a,b) => a+b, 0); }

function getVoterId(){
  try{
    let id = localStorage.getItem(VOTER_KEY);
    if(!id){
      id = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      localStorage.setItem(VOTER_KEY, id);
    }
    return id;
  }catch(e){
    return 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }
}

function renderList(){
  list.innerHTML = '';
  const total = totalCart();
  SONGS.forEach(s => {
    const row = document.createElement('div');
    row.className = 'item' + (cart[s.id] > 0 ? ' active' : '');
    row.innerHTML = `
      <div class="flag">${s.flag}</div>
      <div class="meta">
        <div class="country">${s.country}</div>
        <div class="artist">${s.artist}</div>
        ${s.song ? `<div class="song">«${s.song}»</div>` : ''}
      </div>
      <div class="stepper">
        <button data-act="minus" data-id="${s.id}" ${(cart[s.id]===0 || submitted) ? 'disabled' : ''}>−</button>
        <div class="count">${cart[s.id]}</div>
        <button data-act="plus" data-id="${s.id}" ${(total>=MAX_VOTES || submitted) ? 'disabled' : ''}>+</button>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('button').forEach(b => b.addEventListener('click', onStep));
  cartCount.textContent = total;
  progressFill.style.width = (total/MAX_VOTES*100) + '%';

  if(lastError){
    submitBtn.disabled = false;
    submitBtn.textContent = 'Повторить';
    submitBtn.classList.add('retry');
  } else {
    submitBtn.disabled = total === 0 || submitted;
    submitBtn.textContent = submitted ? 'Учтено ✓' : 'Оформить';
    submitBtn.classList.remove('retry');
  }
}

function onStep(e){
  if(submitted) return;
  const id = e.currentTarget.dataset.id;
  const act = e.currentTarget.dataset.act;
  const total = totalCart();
  if(act === 'plus' && total < MAX_VOTES) cart[id]++;
  if(act === 'minus' && cart[id] > 0) cart[id]--;
  renderList();
}

async function submitVote(){
  const total = totalCart();
  if(total === 0) return;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Отправка…';
  statusMsg.textContent = '';
  statusMsg.className = 'status-msg';
  lastError = false;

  try{
    // text/plain body avoids a CORS preflight against Apps Script
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({voterId: voterId, votes: cart, ts: Date.now()})
    });
    if(!res.ok) throw new Error('bad status');

    submitted = true;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cart)); }catch(e){}
    statusMsg.textContent = '✓ Голоса учтены — спасибо за участие в WildVision!';
    statusMsg.classList.add('ok');
  }catch(e){
    lastError = true;
    statusMsg.textContent = 'Не получилось отправить голоса — нажми «Повторить».';
    statusMsg.classList.add('err');
  }
  renderList();
}

function loadOwnVote(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    Object.keys(saved).forEach(id => { if(cart[id] !== undefined) cart[id] = saved[id]; });
    submitted = true;
    statusMsg.textContent = '✓ Ты уже голосовал(а) в этом браузере.';
    statusMsg.classList.add('ok');
  }catch(e){}
}

/* ---- Admin view: open the page with ?admin at the end of the link ---- */
async function maybeRenderAdmin(){
  if(!new URLSearchParams(location.search).has('admin')) return;
  document.getElementById('admin').style.display = 'block';

  const totalsBox = document.getElementById('adminTotals');
  const votersBox = document.getElementById('adminVoters');
  totalsBox.innerHTML = 'Загрузка…';
  votersBox.innerHTML = '';

  try{
    const res = await fetch(SCRIPT_URL, {method: 'GET'});
    const data = await res.json();
    const totals = data.totals || {};
    const voters = data.voters || [];

    const ranked = SONGS.map(s => ({...s, pts: totals[s.id] || 0})).sort((a,b) => b.pts - a.pts);
    totalsBox.innerHTML = ranked.map(s => `
      <div class="admin-row">
        <div class="af">${s.flag}</div>
        <div class="an">${s.country} — ${s.artist}</div>
        <div class="apts">${s.pts}</div>
      </div>
    `).join('');

    if(voters.length === 0){
      votersBox.innerHTML = '<div class="voter-line">Пока никто не проголосовал</div>';
    } else {
      votersBox.innerHTML = voters.map(v => {
        const parts = SONGS.filter(s => (v.votes[s.id] || 0) > 0).map(s => `${s.flag}×${v.votes[s.id]}`).join('  ');
        return `<div class="voter-line">${String(v.voter).slice(0,10)}… → ${parts || '—'}</div>`;
      }).join('');
    }
  }catch(e){
    totalsBox.innerHTML = 'Не удалось загрузить результаты. Проверь ссылку скрипта и доступ «Все».';
  }
}

async function init(){
  voterId = getVoterId();
  loadOwnVote();
  renderList();
  submitBtn.addEventListener('click', submitVote);
  await maybeRenderAdmin();
}

init();
</script>
</body>
</html>
